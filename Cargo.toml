[package]
name = "suricata-s7comm"
version = "0.1.0"
edition = "2021"
authors = ["Leargas Security"]
description = "Suricata S7comm/S7comm-plus ICS protocol parser plugin"
license = "GPL-2.0"

[lib]
name = "suricata_s7comm"
crate-type = ["cdylib", "rlib"]

[dependencies]
nom7 = { version = "7.0", package = "nom" }
libc = "~0.2.82"
suricata = { path = "/home/leargas/suricata-8.0.6/rust/" }
suricata-sys = { path = "/home/leargas/suricata-8.0.6/rust/sys" }

[features]
default = ["suricata8"]
suricata8 = []
