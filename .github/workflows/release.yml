name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub release with the
# plugin library, rules and docs, built for each Suricata version in the
# build matrix. The tag must match the version in
# Cargo.toml.in, and the CHANGELOG must have a "## [<version>]" section.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & test (Suricata ${{ matrix.suricata }})
    # Older glibc than ubuntu-latest, so the .so also loads on older sensors.
    runs-on: ubuntu-22.04
    strategy:
      # A release ships every version or none.
      fail-fast: true
      matrix:
        suricata: [ "8.0.6", "8.0.8" ]
    env:
      SURICATA_VERSION: ${{ matrix.suricata }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and check version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CRATE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml.in | head -1)"
          if [ "$VERSION" != "$CRATE" ]; then
            echo "::error::tag $TAG does not match Cargo.toml.in version $CRATE"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libpcre2-dev libyaml-dev libjansson-dev libcap-ng-dev \
            libmagic-dev libnet1-dev libpcap-dev zlib1g-dev \
            libnss3-dev libnspr4-dev liblz4-dev curl python3-yaml

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --force cbindgen

      - name: Cache Suricata source build
        id: cache-suricata
        uses: actions/cache@v4
        with:
          path: suricata-${{ env.SURICATA_VERSION }}
          key: suricata-${{ env.SURICATA_VERSION }}-ubuntu-22.04

      - name: Download & build Suricata ${{ env.SURICATA_VERSION }}
        if: steps.cache-suricata.outputs.cache-hit != 'true'
        run: |
          curl -sSLO "https://www.openinfosecfoundation.org/download/suricata-${SURICATA_VERSION}.tar.gz"
          tar xzf "suricata-${SURICATA_VERSION}.tar.gz"
          cd "suricata-${SURICATA_VERSION}"
          ./configure --enable-rust --disable-gccmarch-native
          make -j"$(nproc)"

      - name: Build plugin
        run: make build SURICATA_SRC="$PWD/suricata-${SURICATA_VERSION}"

      - name: Unit tests
        run: make test SURICATA_SRC="$PWD/suricata-${SURICATA_VERSION}"

      # Blocking: a release must not ship with a failing pcap test.
      - name: suricata-verify tests
        run: |
          git clone --depth 1 https://github.com/OISF/suricata-verify.git
          export SURICATA_ICS_PLUGIN="$PWD/target/release/libsuricata_ics.so"
          VERIFY="$PWD/suricata-verify/run.py"
          TESTS="$PWD/tests"
          OUT="$PWD/verify-output"
          cd "suricata-${SURICATA_VERSION}"
          python3 "$VERIFY" --no-validation --testdir="$TESTS" --outdir="$OUT"

      - name: Validate EVE output (core + plugin schema)
        run: |
          (cd suricata-verify/eve-validator && cargo build --release --quiet)
          scripts/eve-schema.py "suricata-${SURICATA_VERSION}/etc/schema.json" > eve-schema.json
          python3 suricata-verify/check-eve.py verify-output -s eve-schema.json

      - name: Package
        run: |
          NAME="suricata-ics-parsers-${{ steps.ver.outputs.version }}-suricata-${SURICATA_VERSION}-linux-x86_64"
          mkdir -p "dist/$NAME/rules" "dist/$NAME/doc" "dist/$NAME/schema"
          cp target/release/libsuricata_ics.so "dist/$NAME/"
          cp rules/*.rules "dist/$NAME/rules/"
          cp doc/*.rst "dist/$NAME/doc/"
          cp schema/*.json "dist/$NAME/schema/"
          cp README.md CHANGELOG.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"
          cp target/release/libsuricata_ics.so "dist/libsuricata_ics-suricata-${SURICATA_VERSION}.so"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.suricata }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        id: sums
        run: |
          cd dist
          sha256sum *.tar.gz *.so > SHA256SUMS
          cat SHA256SUMS
          VERSIONS="$(ls libsuricata_ics-suricata-*.so | sed 's/^libsuricata_ics-suricata-\(.*\)\.so$/\1/' | sort -V | paste -sd, | sed 's/,/, /g')"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          {
            echo "Built for **Suricata ${{ steps.sums.outputs.versions }}**: use the library"
            echo "(\`libsuricata_ics-suricata-<version>.so\`) or tarball for the exact Suricata"
            echo "version you run. The plugin logs a warning if the versions differ; rebuild"
            echo "it from source (\`make build SURICATA_SRC=...\`) for other versions."
            echo
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
          } > NOTES.md
          cat NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file NOTES.md
          else
            gh release create "$TAG" dist/* \
              --title "$TAG — ICS protocol parsers for Suricata ${{ steps.sums.outputs.versions }}" \
              --notes-file NOTES.md
          fi
