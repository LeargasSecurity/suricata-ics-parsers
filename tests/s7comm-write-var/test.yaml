requires:
  min-version: 8.0.0
  # Absolute path to libsuricata_ics.so. The test is skipped when unset.
  env:
    - SURICATA_ICS_PLUGIN

# The capture is also replayed with inline stream handling, where responses
# are parsed on the server's own packets: the flow-direction checks below
# must hold whichever packet flushes a transaction.
command: |
  ${SRCDIR}/src/suricata --init-errors-fatal -k none \
      --set plugins.0="${SURICATA_ICS_PLUGIN}" \
      --set classification-file="${SRCDIR}/etc/classification.config" \
      --set reference-config-file="${SRCDIR}/etc/reference.config" \
      -c "${TEST_DIR}/suricata.yaml" -l "${OUTPUT_DIR}" \
      -r "${TEST_DIR}/input.pcap" -S "${TEST_DIR}/test.rules" && \
  mkdir -p "${OUTPUT_DIR}/inline" && \
  ${SRCDIR}/src/suricata --init-errors-fatal -k none --set stream.inline=true \
      --set plugins.0="${SURICATA_ICS_PLUGIN}" \
      --set classification-file="${SRCDIR}/etc/classification.config" \
      --set reference-config-file="${SRCDIR}/etc/reference.config" \
      -c "${TEST_DIR}/suricata.yaml" -l "${OUTPUT_DIR}/inline" \
      -r "${TEST_DIR}/input.pcap" -S "${TEST_DIR}/test.rules"

checks:
  # S7comm app-layer events are logged with parsed data items
  # (four Write Var requests to MD0, MD4, MD8 and MD12)
  - filter:
      count: 4
      match:
        event_type: s7comm
        s7comm.function_name: "Write Variable"
        s7comm.item.area_name: "Flags (M)"
        s7comm.is_dangerous: true
  - filter:
      count: 1
      match:
        event_type: s7comm
        s7comm.function_name: "Write Variable"
        s7comm.item.address: 12
        s7comm.item.length: 4

  # Read Variable from DB1 with parsed item addressing
  - filter:
      count: 1
      match:
        event_type: s7comm
        s7comm.function_name: "Read Variable"
        s7comm.item.db_number: 1
        s7comm.item.area_name: "Data Block (DB)"

  # COTP TSAP rack/slot addressing is extracted
  - filter:
      count: 8
      match:
        event_type: s7comm
        s7comm.cotp.rack: 0
        s7comm.cotp.slot: 2

  # Write Variable rule fires
  - filter:
      count: 4
      match:
        event_type: alert
        alert.signature_id: 3700009

  # Area-aware write detection fires
  - filter:
      count: 4
      match:
        event_type: alert
        alert.signature_id: 3700106

  # DB-aware read detection fires
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3700200

  # Transaction records are logged in flow direction: src is the client that
  # opened the connection, never the server on port 102, whichever packet
  # flushed the transaction (the request/response direction fields are
  # unaffected).
  - filter:
      count: 0
      match:
        event_type: s7comm
        src_port: 102
  - filter:
      filename: inline/eve.json
      count: 0
      match:
        event_type: s7comm
        src_port: 102
  - filter:
      filename: inline/eve.json
      count: 8
      match:
        event_type: s7comm
