requires:
  min-version: 8.0.0
  # Absolute path to libsuricata_s7comm.so. The test is skipped when unset.
  env:
    - SURICATA_ICS_PLUGIN

command: |
  ${SRCDIR}/src/suricata --init-errors-fatal -k none \
      --set plugins.0="${SURICATA_ICS_PLUGIN}" \
      --set classification-file="${SRCDIR}/etc/classification.config" \
      --set reference-config-file="${SRCDIR}/etc/reference.config" \
      -c "${TEST_DIR}/suricata.yaml" -l "${OUTPUT_DIR}" \
      -r "${TEST_DIR}/input.pcap" -S "${TEST_DIR}/test.rules"

checks:
  # Security userdata group (password protection) is detected and flagged
  - filter:
      count: 1
      match:
        event_type: s7comm
        s7comm.rosctr: "Userdata"
        s7comm.userdata_group_name: "Security"
        s7comm.is_dangerous: true
        s7comm.attack_technique: "T0859 Valid Accounts / T0812 Default Credentials"

  # Read SZL reconnaissance is detected
  - filter:
      count: 2
      match:
        event_type: s7comm
        s7comm.userdata_group_name: "CPU Functions"

  # Security access rule fires
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3700102

  # SZL recon rule fires
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 3700103

  # Frame-based rule fires (validates frame registration)
  - filter:
      count: 3
      match:
        event_type: alert
        alert.signature_id: 3700300
