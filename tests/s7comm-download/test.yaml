requires:
  min-version: 8.0.0
  # Absolute path to libsuricata_ics.so. The test is skipped when unset.
  env:
    - SURICATA_ICS_PLUGIN

command: |
  ${SRCDIR}/src/suricata --init-errors-fatal -k none \
      --set plugins.0="${SURICATA_ICS_PLUGIN}" \
      --set classification-file="${SRCDIR}/etc/classification.config" \
      --set reference-config-file="${SRCDIR}/etc/reference.config" \
      -c "${TEST_DIR}/suricata.yaml" -l "${OUTPUT_DIR}" \
      -r "${TEST_DIR}/input.pcap" -S "${TEST_DIR}/test.rules"

checks:
  # Setup Communication is detected
  - filter:
      count: 3
      match:
        event_type: alert
        alert.signature_id: 3700010

  # Request Download (dangerous program transfer) is detected
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 3700003

  # The generic "dangerous operation" keyword fires on the download
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 3700099

  # S7comm event log carries the Request Download with ATT&CK mapping
  - filter:
      count: 1
      match:
        event_type: s7comm
        s7comm.function_name: "Request Download"
        s7comm.is_dangerous: true
        s7comm.attack_technique: "T0843 Program Download"
