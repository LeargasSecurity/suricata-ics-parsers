requires:
  min-version: 8.0.0
  # Absolute path to libsuricata_s7comm.so. The test is skipped when unset.
  env:
    - SURICATA_ICS_PLUGIN

command: |
  ${SRCDIR}/src/suricata --init-errors-fatal -k none \
      --set plugins.0="${SURICATA_ICS_PLUGIN}" \
      --set classification-file="${SRCDIR}/etc/classification.config" \
      --set reference-config-file="${SRCDIR}/etc/reference.config" \
      -c "${TEST_DIR}/suricata.yaml" -l "${OUTPUT_DIR}" \
      -r "${TEST_DIR}/input.pcap" -S "${TEST_DIR}/test.rules"

checks:
  # Read SZL reconnaissance is detected via userdata group/subfunction keywords
  - filter:
      count: 68
      match:
        event_type: alert
        alert.signature_id: 3700103

  # Userdata group name is resolved in the EVE log
  - filter:
      count: 70
      match:
        event_type: s7comm
        s7comm.rosctr: "Userdata"
        s7comm.userdata_group_name: "CPU Functions"
