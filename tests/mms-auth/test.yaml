requires:
  min-version: 8.0.0
  # Absolute path to libsuricata_s7comm.so (it also provides the mms parser).
  # The test is skipped when this is not set.
  env:
    - SURICATA_ICS_PLUGIN

# Run with the shipped rules/mms.rules so the test guards the real ruleset.
command: |
  ${SRCDIR}/src/suricata --init-errors-fatal -k none \
      --set plugins.0="${SURICATA_ICS_PLUGIN}" \
      --set classification-file="${SRCDIR}/etc/classification.config" \
      --set reference-config-file="${SRCDIR}/etc/reference.config" \
      -c "${TEST_DIR}/suricata.yaml" -l "${OUTPUT_DIR}" \
      -r "${TEST_DIR}/input.pcap" -S "${TEST_DIR}/../../rules/mms.rules"

checks:
  # Two associations with ACSE password authentication (accepted, then a wrong
  # password that the server rejects by closing the connection).
  - filter:
      count: 2
      match:
        event_type: alert
  - filter:
      count: 2
      match:
        event_type: alert
        alert.signature_id: 3702001
  - filter:
      count: 2
      match:
        event_type: mms
        mms.request.acse: aarq
        mms.request.authentication: true
        mms.request.authentication_mechanism: "2.2.3.1"
  - filter:
      count: 1
      match:
        event_type: mms
        mms.request.acse: aarq
        mms.response.result: accepted
