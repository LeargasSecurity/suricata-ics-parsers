[package]
name = "suricata-ics-parsers-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
suricata-ics-parsers = { path = ".." }

[[bin]]
name = "cotp"
path = "fuzz_targets/cotp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mms_message"
path = "fuzz_targets/mms_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mms_state"
path = "fuzz_targets/mms_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "s7comm"
path = "fuzz_targets/s7comm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iec104"
path = "fuzz_targets/iec104.rs"
test = false
doc = false
bench = false

# Separate workspace: the parent Cargo.toml is generated by `make configure`.
[workspace]
members = ["."]

[profile.release]
debug = 1
